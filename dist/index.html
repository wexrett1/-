<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Билеты ПДД, короткие уроки и пробный экзамен для подготовки на права.">
<meta name="theme-color" content="#111527">
<title>Маршрут ПДД — тренажёр</title>
<link rel="stylesheet" href="./style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="./app.js"></script>
</head>
<body>
<svg class="icon-definitions" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="streak-flame" viewBox="0 0 24 24">
    <path fill="currentColor" d="M14.1 2.2c.8 4.9 5.1 6.1 6.5 10.6 1.7 5.4-2 9.2-7.9 9.2-5.3 0-8.7-3.3-8.3-8.2.3-3.1 1.9-5.3 4-7.3-.2 2.8.8 4 2.2 4.4.2-3 2.4-4.8 3.5-8.7Z"/>
    <path fill="var(--flame-core, currentColor)" d="M13.4 11.8c.8 2.5 3.1 3.5 3.1 5.6 0 2-1.6 3.1-3.8 3.1-2 0-3.7-1.2-3.7-3 .1-1.9 1.8-3.5 4.4-5.7Z"/>
  </symbol>
</svg>
<header class="topbar">
  <div class="header-inner">
    <button class="brand" data-page="home" aria-label="Маршрут ПДД — главная"><span class="mark" aria-hidden="true"><i></i></span><span>Маршрут<span class="brand-sub">ПДД</span></span></button>
    <nav aria-label="Разделы">
      <button data-page="home"><span class="nav-icon icon-route" aria-hidden="true"></span>Путь</button>
      <button data-page="tickets"><span class="nav-icon icon-tickets" aria-hidden="true"></span>Билеты</button>
      <button data-page="exam"><span class="nav-icon icon-exam" aria-hidden="true"></span>Экзамен</button>
      <button data-page="profile"><span class="nav-icon icon-progress" aria-hidden="true"></span>Прогресс</button>
    </nav>
    <div class="header-actions">
      <button data-page="profile" id="streak-badge" class="profile-link streak-badge" aria-label="Огоньки и прогресс">
        <svg class="flame" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#streak-flame"/></svg><span id="streak-count" aria-hidden="true">0</span>
      </button>
      <button data-page="pro" class="pro-link">Pro</button>
    </div>
  </div>
</header>
<main id="app"><p class="panel narrow" role="status">Загружаем билеты…</p></main>
<footer><span>Маршрут ПДД</span><a href="https://github.com/etspring/pdd_russia" target="_blank" rel="noopener">Источник билетов</a></footer>
<dialog id="illustration-viewer" class="illustration-viewer" aria-labelledby="illustration-title">
  <div class="illustration-header">
    <h2 id="illustration-title">Дорожная ситуация</h2>
    <button class="secondary illustration-close" data-action="close-illustration" autofocus>Закрыть</button>
  </div>
  <div class="illustration-frame" tabindex="0" aria-label="Изображение дорожной ситуации">
    <img class="viewer-image" alt="Дорожная ситуация к вопросу">
  </div>
  <div class="illustration-actions">
    <p class="illustration-hint" id="illustration-hint" hidden>Прокрути изображение, чтобы рассмотреть края.</p>
    <button class="primary" data-action="zoom-illustration" aria-pressed="false">Приблизить</button>
  </div>
</dialog>
</body></html>
